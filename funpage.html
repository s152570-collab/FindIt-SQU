
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FindIt-SQU Fun Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5 text-center">

        <div class="card shadow p-4">

            <h1 class="text-primary">Find the Lost Item!</h1>

            <p>A student lost their phone somewhere on campus.</p>
            <p>Can you guess which box contains the phone?</p>

            <h4>Choose a Box</h4>

            <div class="d-flex justify-content-center gap-3 my-4">
                <button class="btn btn-outline-primary"
                        onclick="checkBox(1)">
                    📦 Box 1
                </button>

                <button class="btn btn-outline-primary"
                        onclick="checkBox(2)">
                    📦 Box 2
                </button>

                <button class="btn btn-outline-primary"
                        onclick="checkBox(3)">
                    📦 Box 3
                </button>
            </div>

            <h4 id="message"></h4>

            <p id="attempts">Attempts: 0</p>

            <button class="btn btn-success mt-3"
                    onclick="resetGame()">
                Play Again
            </button>

        </div>

    </div>

    <script src="js/fun.js"></script>

</body>
</html>

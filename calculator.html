
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost and Found Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">

            <h2 class="text-primary">
                Lost and Found Reward Calculator
            </h2>

            <p>Calculate a suggested reward for returning a lost item.</p>

            <!-- Item value -->
            <label class="form-label">Item Value (OMR)</label>
            <input type="number" id="itemValue"
                   class="form-control mb-3"
                   min="0" step="0.01">

            <!-- Days lost -->
            <label class="form-label">Days Lost</label>
            <input type="number" id="daysLost"
                   class="form-control mb-3"
                   min="0" step="1">

            <!-- Item condition -->
            <label class="form-label">Item Condition</label>
            <select id="condition" class="form-select mb-3">
                <option value="good">Good</option>
                <option value="damaged">Damaged</option>
            </select>

            <!-- Calculate button -->
            <button type="button"
                    class="btn btn-primary"
                    onclick="calculateReward()">
                Calculate Reward
            </button>

            <!-- Result -->
            <h4 id="result" class="mt-4"></h4>

        </div>
    </div>

    <!-- Connect JavaScript -->
    <script src="js/calculator.js"></script>

</body>
</html>
